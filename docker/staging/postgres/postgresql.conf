# PostgreSQL 17 Staging Configuration
# Enables continuous WAL archiving for pgBackRest

listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Write-Ahead Logging & Continuous Archiving
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=skinlab archive-push %p'
max_wal_senders = 5
wal_keep_size = 512MB

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
timezone = 'Asia/Ho_Chi_Minh'

