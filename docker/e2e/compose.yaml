# Docker Compose Configuration for Foundation E2E Tests
# Pinned immutable SHA-256 digests matching staging architecture.

networks:
  skinlab-e2e:
    driver: bridge

volumes:
  postgres-e2e-data:
  minio-e2e-data:

services:
  postgres:
    image: postgres:17-alpine@sha256:91bf78546b334d580ce42013eb11b157467614d35eb730c449e75551ecbecc66
    container_name: skinlab-e2e-postgres
    environment:
      - POSTGRES_DB=skinlab_e2e
      - POSTGRES_USER=skinlab
      - POSTGRES_PASSWORD=skinlab_e2e_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data
    networks:
      - skinlab-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinlab -d skinlab_e2e"]
      interval: 3s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z@sha256:f4b66df22ee9bcf7a6e11e033d52aa52a16d56df42cbfae259e8306dfc31dbb7
    container_name: skinlab-e2e-minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=skinlab
      - MINIO_ROOT_PASSWORD=skinlab_e2e_minio_password
    ports:
      - "9010:9000"
    volumes:
      - minio-e2e-data:/data
    networks:
      - skinlab-e2e
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-02-07T23-21-09Z@sha256:2fa9f7832625299c89cefc73e8fa9f3f4e1f7dca1316e100dc89eb0b10620ef3
    container_name: skinlab-e2e-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 skinlab skinlab_e2e_minio_password &&
      mc mb --ignore-existing local/skinlab-clinical-media &&
      mc version enable local/skinlab-clinical-media &&
      mc anonymous set none local/skinlab-clinical-media &&
      exit 0
      "
    networks:
      - skinlab-e2e

