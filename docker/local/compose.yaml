services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skinlab
      POSTGRES_USER: skinlab
      POSTGRES_PASSWORD: skinlab
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinlab -d skinlab"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - skinlab-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skinlab
      MINIO_ROOT_PASSWORD: skinlab_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - skinlab-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-07T23-21-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 skinlab skinlab_minio_password &&
      mc mb --ignore-existing local/skinlab-clinical-media &&
      mc anonymous set none local/skinlab-clinical-media &&
      exit 0
      "

volumes:
  skinlab-postgres-data:
  skinlab-minio-data:
